<po-page-default p-title="Componentes de Preço" [p-actions]="pageActions">
  <div class="catalog-page">
    <p class="status-message" *ngIf="statusMessage">{{ statusMessage }}</p>

    <section class="component-grid">
      <article class="component-card" *ngFor="let component of rows" [class.inactive]="!component.active">
        <button type="button" class="card-head" (click)="toggleExpanded(component.id)">
          <span>
            <small>{{ component.code }} · {{ component.group }}</small>
            <strong>{{ component.description }}</strong>
          </span>
          <span class="head-meta">
            <b>{{ selectedSummary(component) }}</b>
            <em>{{ component.status }}</em>
          </span>
        </button>

        <div class="card-body" *ngIf="isExpanded(component.id)">
          <div class="meta-grid">
            <span><small>Variável APV</small><b>{{ component.varAPV }}</b></span>
            <span><small>Tipo</small><b>{{ component.type }}</b></span>
            <span><small>Fórmula</small><b>{{ component.formula || '--' }}</b></span>
          </div>

          <div class="option-list" *ngIf="component.options.length">
            <button
              type="button"
              class="option-row"
              *ngFor="let option of component.options"
              [class.selected]="option.selected"
              (click)="selectOption(component, option)"
            >
              <span>
                <strong>{{ option.code }}</strong>
                <small>{{ option.description }}</small>
              </span>
              <b>{{ formatPercent(option.calculatedValue) }}</b>
            </button>
          </div>

          <div class="card-actions">
            <po-button p-icon="an an-pencil-simple" p-label="Editar" (p-click)="edit(component)"></po-button>
            <po-button
              p-icon="an an-power"
              [p-label]="component.active ? 'Inativar' : 'Ativar'"
              (p-click)="toggle(component)"
            ></po-button>
          </div>
        </div>
      </article>
      <p class="empty-state" *ngIf="!rows.length">Nenhum componente encontrado.</p>
    </section>
  </div>

  <po-page-slide #filtersSlide p-title="Filtros" p-size="sm" [p-click-out]="true">
    <div class="form-grid">
      <po-input name="searchTerm" p-label="Buscar" [(ngModel)]="filterDraft.searchTerm"></po-input>
      <po-select
        name="groupFilter"
        p-label="Grupo"
        [p-options]="groupOptions"
        [ngModel]="filterDraft.groupFilter"
        (ngModelChange)="filterDraft.groupFilter = $event"
      ></po-select>
      <po-select
        name="statusFilter"
        p-label="Status"
        [p-options]="statusOptions"
        [ngModel]="filterDraft.statusFilter"
        (ngModelChange)="filterDraft.statusFilter = $event"
      ></po-select>
    </div>

    <po-page-slide-footer>
      <po-button p-label="Limpar" (p-click)="clearFilters()"></po-button>
      <po-button p-kind="primary" p-label="Pesquisar" (p-click)="applyFilters()"></po-button>
    </po-page-slide-footer>
  </po-page-slide>

  <po-modal #componentModal p-title="Componente de preço">
    <div class="form-grid">
      <po-input name="code" p-label="Código" [(ngModel)]="editModel.code"></po-input>
      <po-input name="description" p-label="Descrição" [(ngModel)]="editModel.description"></po-input>
      <po-select
        name="type"
        p-label="Tipo"
        [p-options]="typeOptions"
        [ngModel]="editModel.type"
        (ngModelChange)="editModel.type = $event"
      ></po-select>
      <po-input name="unit" p-label="Unidade" [(ngModel)]="editModel.unit"></po-input>
      <po-input name="group" p-label="Grupo" [(ngModel)]="editModel.group"></po-input>
      <po-input name="varAPV" p-label="Variável APV" [(ngModel)]="editModel.varAPV"></po-input>
      <po-input name="formula" p-label="Fórmula" [(ngModel)]="editModel.formula"></po-input>
    </div>

    <div class="checkbox-row">
      <label><input type="checkbox" [(ngModel)]="editModel.active" /> Ativo</label>
      <label><input type="checkbox" [(ngModel)]="editModel.multiple" /> Múltipla seleção</label>
    </div>

    <po-textarea
      name="options"
      p-label="Opções"
      p-help="Uma opção por linha: CÓDIGO=Descrição | percentual | valor custo | padrão"
      [(ngModel)]="optionDraft"
    ></po-textarea>

    <po-modal-footer>
      <po-button p-label="Cancelar" (p-click)="componentModal.close()"></po-button>
      <po-button p-kind="primary" p-label="Salvar" (p-click)="save()"></po-button>
    </po-modal-footer>
  </po-modal>
</po-page-default>
