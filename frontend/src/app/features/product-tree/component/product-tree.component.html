<po-page-default p-title="Arvore de Produto">
  <div class="tree-grid">
    <po-container p-title="Produtos">
      <div class="create-panel">
        <po-input name="groupCode" p-label="Codigo grupo" [(ngModel)]="groupModel.code"></po-input>
        <po-input name="groupName" p-label="Nome grupo" [(ngModel)]="groupModel.name"></po-input>
        <po-button p-icon="an an-plus" p-label="Grupo" (p-click)="addGroup()"></po-button>
      </div>
      <div class="create-panel">
        <po-select
          name="productGroup"
          p-label="Grupo"
          [p-options]="groupOptions"
          [ngModel]="productModel.groupId"
          (ngModelChange)="productModel.groupId = $event"
        ></po-select>
        <po-input name="productCode" p-label="Codigo produto" [(ngModel)]="productModel.code"></po-input>
        <po-input name="productName" p-label="Nome produto" [(ngModel)]="productModel.name"></po-input>
        <po-button p-icon="an an-plus" p-label="Produto" (p-click)="addProduct()"></po-button>
      </div>

      <div class="tree-list">
        <ng-container *ngFor="let group of tree">
          <div class="group-title">{{ group.code }} - {{ group.name }}</div>
          <button
            type="button"
            class="product-row"
            *ngFor="let product of group.children"
            [class.active]="product.id === selectedProductId"
            (click)="selectProduct(product.id)"
          >
            <strong>{{ product.name }}</strong>
            <small>{{ product.code }}</small>
          </button>
        </ng-container>
      </div>
    </po-container>

    <po-container [p-title]="'Composicao - ' + (selectedProduct?.name || '')">
      <div
        class="composition-zone"
        [class.empty]="!selectedComponents.length"
        (dragover)="allowDrop($event)"
        (drop)="dropOnComposition($event)"
      >
        <ng-container *ngIf="selectedComponents.length; else noComposition">
          <div
            class="component-row"
            *ngFor="let component of selectedComponents; let index = index"
            draggable="true"
            (dragstart)="beginComponentDrag($event, component.id, 'composition')"
            (dragover)="allowDrop($event)"
            (drop)="dropOnComposition($event, index)"
          >
            <span class="order">{{ index + 1 }}</span>
            <span>
              <strong>{{ component.description }}</strong>
              <small>{{ component.code }} · {{ component.varAPV }}</small>
            </span>
            <button type="button" (click)="removeComponent(component.id)" aria-label="Remover">x</button>
          </div>
        </ng-container>
        <ng-template #noComposition>
          <p>Arraste componentes para montar a composicao.</p>
        </ng-template>
      </div>

      <div class="actions-row">
        <po-button p-kind="primary" p-icon="an an-floppy-disk" p-label="Salvar" (p-click)="saveComposition()"></po-button>
        <po-button p-icon="an an-arrow-counter-clockwise" p-label="Reverter" (p-click)="revertComposition()"></po-button>
        <po-button p-icon="an an-trash" p-label="Limpar" (p-click)="clearComposition()"></po-button>
        <span>{{ selectedComponents.length }} componentes</span>
      </div>
      <p class="status-message" *ngIf="statusMessage">{{ statusMessage }}</p>
    </po-container>

    <po-container p-title="Biblioteca">
      <div class="library-zone" (dragover)="allowDrop($event)" (drop)="dropOnLibrary($event)">
        <button
          type="button"
          class="library-chip"
          *ngFor="let component of availableComponents"
          draggable="true"
          (dragstart)="beginComponentDrag($event, component.id, 'library')"
          (click)="addComponent(component.id)"
        >
          <strong>{{ component.description }}</strong>
          <small>{{ component.group }} · {{ component.varAPV }}</small>
        </button>
        <p class="empty-state" *ngIf="!availableComponents.length">Todos os componentes ativos ja estao vinculados.</p>
      </div>
    </po-container>
  </div>
</po-page-default>
